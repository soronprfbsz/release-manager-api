services:
  mariadb:
    image: mariadb:10.11.5
    container_name: release-manager-mariadb
    env_file:
      - ../.env
    ports:
      - "0.0.0.0:${MARIADB_PORT}:3306"
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_general_ci"
      - --slow-query-log=1
      - --long-query-time=5
      - --slow-query-log-file=/var/log/mysql/slow-query.log
    volumes:
      - /data/release-manager/mariadb/lib:/var/lib/mysql
      - /data/release-manager/mariadb/log:/var/log/mysql
      - ./init-mariadb.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks:
      - network-ts
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USERNAME}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:8.2.3
    container_name: release-manager-redis
    env_file:
      - ../.env
    ports:
      - "0.0.0.0:${REDIS_PORT}:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - yes
      - --appendfilename
      - appendonly.aof
      - --dir
      - /data
    volumes:
      - /data/release-manager/redis/data:/data
    networks:
      - network-ts
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    image: ${DOCKER_IMAGE:-ts/release-manager-api:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${SERVER_NAME}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # JVM 설정 (heap메모리 1GB)
      JAVA_OPTS: "-Xms1024m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      # JVM 의 LocalDateTime.now() 가 UTC 가 되도록 — DB 는 모두 UTC 저장 정책.
      # 사용자 표시는 frontend 가 KST 변환 (shared/lib/utils/date.ts).
      # 사람이 읽는 일부 시간(README, 빌드 yyMMdd 등)은 코드에서 명시적 KST 사용.
      TZ: UTC
    volumes:
      - ${RELEASE_DIR}:/app/resources
    ports:
      # 호스트:컨테이너 포트 매핑
      - "${SERVER_EXTERNAL_PORT:-18080}:${SERVER_PORT:-8081}"
      - "${GRPC_PORT:-9090}:9090"
    networks:
      - network-ts
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:${SERVER_PORT:-8081}/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  network-ts:
    external: true
