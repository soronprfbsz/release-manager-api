spring:
  # Profile Configuration
  profiles:
    active: ${SERVER_ENVIRONMENT:dev}

  # Jackson — DB 저장 / API 응답 모두 UTC ISO 8601(Z) 직렬화.
  # 표시용 KST 변환은 frontend(shared/lib/utils/date.ts) 가 담당.
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  # Multipart File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10GB
      max-request-size: 10GB

  # MVC Configuration
  mvc:
    async:
      request-timeout: 7200000  # 2시간 (밀리초) - 대용량 파일 업로드/다운로드

  # MariaDB Database Configuration
  datasource:
    url: jdbc:mariadb://${MARIADB_HOST}:${MARIADB_PORT}/${MARIADB_DATABASE}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${MARIADB_USERNAME}
    password: ${MARIADB_PASSWORD}
    hikari:
      maximum-pool-size: ${MARIADB_POOL_SIZE:10}
      minimum-idle: ${MARIADB_POOL_MIN_IDLE:5}
      connection-timeout: ${MARIADB_CONNECTION_TIMEOUT:30000}

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  # Flyway Configuration
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true  # 기존 DB에 flyway_schema_history 없으면 baseline 생성
    baseline-version: 0        # 기존 스키마는 V0으로 간주
    validate-on-migrate: true  # 마이그레이션 전 검증
    out-of-order: false        # 순서 어긋난 마이그레이션 불허
    locations: classpath:db/migration

# Server Configuration
server:
  name: ${SERVER_NAME}
  host: ${SERVER_HOST:localhost}
  port: ${SERVER_PORT:8080}
  tomcat:
    connection-timeout: 7200000  # 2시간 (밀리초) - 대용량 파일 처리

# Swagger/OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  override-with-generic-response: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# gRPC Configuration
grpc:
  server:
    host: ${GRPC_HOST:localhost}
    port: ${GRPC_PORT:9090}
    timeout: ${GRPC_TIMEOUT:30}
    maxRetryAttempts: ${GRPC_MAX_RETRY:3}

# Logging Configuration
logging:
  # Logback console / file appender 의 출력 charset — 한글 로그가 OS default
  # (Windows: CP949) 로 인코딩되어 콘솔에서 mojibake 되는 문제 차단.
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.ts.rm: INFO
    # API 요청/응답 로깅 (INFO: 간결, DEBUG: 상세)
    com.ts.rm.global.common.filter.ApiLoggingFilter: INFO
    # Hibernate SQL 로그 비활성화 (p6spy 사용)
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    # p6spy SQL 로거 (INFO: SQL만, DEBUG: 상세)
    p6spy: INFO
    org.springframework.web: INFO

# Application Configuration
app:
  release:
    # 로컬: data/release-manager, 도커: /app/resources
    base-path: ${RELEASE_BASE_PATH:/app/resources}
  jwt:
    secret: ${JWT_SECRET} # 토큰 서명 키
    expiration: ${JWT_EXPIRATION:900000}  # Access Token 만료 15분 (밀리초)
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # Refresh Token 만료 7일 (밀리초)
    issuer: ${JWT_ISSUER:release-manager} # 발급자 식별자

# Patch Configuration
patch:
  cleanup:
    # 생성 후 이 일수가 지난 패치 파일을 자동 정리 (스케줄러 patch-cleanup 의 기본 보관 기간)
    retention-days: 30

# Message Configuration
message:
  # 시스템 발신 알림(패치 독촉, 비밀번호 재설정/가입 처리 요청)의 발신자 계정 이메일.
  # 이 계정을 찾지 못하면 — 패치 독촉은 발송만 건너뛰고 스케줄은 성공 처리되지만,
  # 비밀번호 재설정/가입 처리 요청은 500 으로 실패한다. 특히 가입 처리 요청은
  # signUp 트랜잭션 안에서 호출되므로 회원가입 전체가 500 으로 롤백된다.
  system-sender-email: ${MESSAGE_SYSTEM_SENDER_EMAIL:admin@tscientific.co.kr}

account:
  request:
    # 같은 계정의 비밀번호 재설정 요청을 이 분(minute) 단위 버킷으로 묶어 중복 발송을 막는다.
    # 고정 윈도라 버킷 경계에서는 짧은 간격의 연속 2건이 나갈 수 있다. 60 의 약수를 쓸 것.
    password-reset-cooldown-minutes: 10
